name: harness-smoke
description: |
  Smoke test that the eval harness can load a fixture, run it through the
  MockRunner, and verify the output is non-empty. Real behavioral fixtures
  land once the LLM provider is wired in (Phase 1.5).
behavior_spec_version: v0.1
scenario:
  turns:
    - speaker: player
      text: "I look around."
expectations:
  - kind: not_empty
    field: narration
  - kind: contains
    field: narration
    text: "look around"
    description: "MockRunner echoes the player text, so the player's words should appear in the narration."
