name: harness-smoke
description: |
  Smoke test that the eval harness can load a fixture, build an
  OrchestratorRunner backed by a FakeLLMProvider driven by `llm_script`,
  and verify the resulting narration. This exercises the Phase 1.5c
  wiring end-to-end.
behavior_spec_version: v0.1
scenario:
  turns:
    - speaker: player
      text: "I look around."
llm_script:
  narration: "The dusty room is quiet; motes drift through a single shaft of light."
expectations:
  - kind: not_empty
    field: narration
  - kind: contains
    field: narration
    text: "dusty room"
    description: "FakeLLMProvider emits the scripted narration verbatim."
