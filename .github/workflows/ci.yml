name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: License headers
        run: pnpm check:headers

      - name: Telemetry-event registry
        run: pnpm check:telemetry-events

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Tests
        run: pnpm test

      - name: Eval harness
        id: eval
        continue-on-error: true
        run: pnpm eval

      - name: Post eval failures as PR comment
        if: ${{ github.event_name == 'pull_request' && steps.eval.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f eval/last-run.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('eval/last-run.json','utf8'));
              const { formatMarkdownReport } = await import('./eval/src/reporter.ts');
              process.stdout.write(formatMarkdownReport(r));
            " > /tmp/eval-comment.md 2>/dev/null || cat eval/last-run.json > /tmp/eval-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/eval-comment.md
          fi

      - name: Fail if eval failed
        if: ${{ steps.eval.outcome == 'failure' }}
        run: exit 1
