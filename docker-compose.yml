#
# `docker compose up` runs the operator app (console on localhost:3000).
# Foundry runs outside this compose, on the operator's own machine/network. There
# is no third-party connector: enable the first-party Skeinkeeper add-on in your
# Foundry world and point it at this app's gateway (default ws://127.0.0.1:7733).
# Same-machine (loopback) is the default; a Foundry that must reach the gateway
# across the network needs FOUNDRY_GATEWAY_BIND=lan + a pairing secret + TLS
# (see docs/INSTALL.md). The add-on always presents the pairing secret.
services:
  app:
    build: .
    env_file: .env
    ports:
      - "${SKEINKEEPER_WEB_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
